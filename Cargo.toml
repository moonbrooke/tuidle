[package]
name = "tuidle"
version = "0.1.3"
edition = "2021"
description = "Wordle clone in your terminal"
license = "MIT"
readme = "README.md"

[dependencies]
crossterm = "0.28"
rand = "0.8"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
